<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rex首页工具</title>
<meta name="description" content="Rex 播放器首页模块与导出工具：编辑导出首页包、Forward 转 Rex、图文教学。">
<style>
:root{--bg:#f6f4fa;--panel:#fff;--ink:#211b2c;--muted:#665c76;--line:#e4ddec;--accent:#7137ce;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#151019;--panel:#221a2b;--ink:#f1eafa;--muted:#b7aac7;--line:#40324f;--accent:#bd95ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:32px max(16px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:0 0 6px}p{margin:0 0 18px;color:var(--muted)}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;color:var(--ink);text-decoration:none}
a.card b{display:block;font-size:18px;color:var(--accent)}a.card span{font-size:14px;color:var(--muted)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
footer{text-align:center;font-size:13px;color:var(--muted);margin-top:22px}footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Rex首页工具</h1>
<p>Rex 播放器首页模块与导出工具 · 作者：Bolinxxlin</p>
<a class="card" href="builder/"><b>首页导出工具</b><span>载入成品首页或自己的首页、备份，调整后导出 .rex，iPhone、iPad、Mac 都能用</span></a>
<a class="card" href="fwd2rex/"><b>Forward 转 Rex</b><span>把 Forward 的 .fwd 或备份转成 Rex 首页包</span></a>
<a class="card" href="export/"><b>图文教学</b><span>成品首页、编辑、导出与导入的步骤说明</span></a>
<footer><a href="https://github.com/kenxtbecdi7690/rex-home">GitHub 源码与说明</a></footer>
</main>
</body>
</html>
